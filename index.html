<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>마트 카트 레이싱</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{
 "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
 "cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head><body>
<div id="hud">
 <div id="hudL"><div>⏱ 시간 <b id="time">0:00.00</b></div><div>🏁 랩 <b id="lap">1/3</b></div><div>🏆 순위 <b id="rank">1/4</b></div></div>
 <div id="hudR"><div>💥 혼돈 지수 <b id="chaos">0</b></div><div>🧍 넘어뜨린 손님 <b id="knocked">0</b></div><div>🥫 떨어뜨린 상품 <b id="spilled">0</b></div></div>
 <div id="hudB"><div id="speed">0 km/h</div><div id="boostBar"><div id="boostFill"></div></div><div class="small">부스트</div></div>
</div>
<div id="countdown"></div>
<div id="msg"></div>
<div id="help">조작: ↑/W 가속 · ↓/S 브레이크·후진 · ←→/A D 조향 · 스페이스 부스트 · M 소리 · T 자동가속 · R 다시 시작</div>
<button id="mute" title="소리 켜기/끄기 (M)">🔊</button>
<div id="touch">
 <div class="dpad"><button data-key="ArrowUp" class="up">▲</button><button data-key="ArrowLeft" class="left">◀</button><button data-key="ArrowRight" class="right">▶</button><button data-key="ArrowDown" class="down">▼</button></div>
 <div class="tr"><button data-key="Space" class="boost">부스트</button></div>
</div>
<button id="auto"></button>
<canvas id="minimap" width="150" height="100"></canvas>
<div id="bubbles"></div>
<div id="finish" class="hidden"><div class="panel"><h1 id="finTitle">결승!</h1><div id="finBody"></div><button id="restart">다시 시작</button></div></div>
<script type="module" src="js/main.js"></script>
</body></html>
